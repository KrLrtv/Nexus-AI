name: Validate autonomous public sources
on:
  push:
    branches: [feature/nexus-public-sources]
permissions:
  contents: write
concurrency:
  group: nexus-public-sources
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'KrLrtv/Nexus-AI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact-source integration
        run: python scripts/integrate_public_sources.py
      - name: Validate source and release metadata
        run: |
          set -euo pipefail
          git diff --check
          bash -n install.sh scripts/termux-install.sh
          python scripts/check_release_consistency.py
          python scripts/check_public_source.py
          python - <<'PY'
          import ast
          from pathlib import Path
          for p in Path('nexus-ai').rglob('*.py'):
              ast.parse(p.read_text(encoding='utf-8-sig'), filename=str(p))
          PY
      - name: Full offline regression suite
        run: |
          set -euo pipefail
          python -m unittest discover -s nexus-ai/tests -p 'test_*.py' -v 2>&1 | tee /tmp/nexus-public-tests.txt
      - name: Live public HTTPS transport smoke test (no Gemini or private data)
        run: |
          PYTHONPATH=nexus-ai/android_bridge python - <<'PY' | tee /tmp/nexus-public-https.txt
          import json
          from source_http import fetch
          doc = fetch('https://api.github.com/repos/KrLrtv/Nexus-AI')
          data = json.loads(doc.body)
          assert data['full_name'] == 'KrLrtv/Nexus-AI'
          print('Live public HTTPS: OK; pinned DNS, verified TLS, JSON response.')
          print('Retrieved:', doc.retrieved_at, 'SHA256:', doc.digest)
          print('This does not test Gemini generation, Android or M5.')
          PY
      - name: Commit tested integration on feature branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'feature/nexus-public-sources'
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nexus-ai/android_bridge/app.py nexus-ai/android_bridge/planner.py
          if ! git diff --cached --quiet; then
            git commit -m 'feat: integrate tested autonomous public-source acquisition'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          git archive --format=zip --prefix=Nexus-AI-public-sources/ -o /tmp/nexus-public-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-public-sources-tested
          path: |
            /tmp/nexus-public-source.zip
            /tmp/nexus-public-tests.txt
            /tmp/nexus-public-https.txt
          retention-days: 7
