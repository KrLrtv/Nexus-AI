name: Publish NEXUS v2.0.7-alpha Public Source Learning
on:
  push:
    branches: [release/public-sources-v2.0.7]
permissions:
  contents: write
concurrency:
  group: nexus-public-v2.0.7-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'KrLrtv/Nexus-AI'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned preview metadata
        run: python scripts/prepare_public_sources_release.py
      - name: Validate source and metadata
        run: |
          set -euo pipefail
          git diff --check
          bash -n install.sh scripts/termux-install.sh
          python scripts/check_release_consistency.py
          python scripts/check_public_source.py
          sha256sum --check SHA256SUMS.txt
          python scripts/integrate_public_sources.py
          python - <<'PY'
          import ast, json
          from pathlib import Path
          for root in ('nexus-ai', 'scripts'):
              for p in Path(root).rglob('*.py'):
                  ast.parse(p.read_text(encoding='utf-8-sig'), filename=str(p))
          data = json.loads(Path('releases/preview.json').read_text())
          assert data['tag'] == 'v2.0.7-alpha' and data['channel'] == 'preview'
          assert 'learn_public_source' in Path('nexus-ai/android_bridge/planner.py').read_text()
          PY
      - name: Run complete offline suite
        run: |
          set -euo pipefail
          python -m unittest discover -s nexus-ai/tests -p 'test_*.py' -v 2>&1 | tee /tmp/nexus-v2.0.7-tests.txt
      - name: Live public HTTPS smoke test
        run: |
          set -euo pipefail
          PYTHONPATH=nexus-ai/android_bridge python - <<'PY' | tee /tmp/nexus-v2.0.7-https.txt
          import json
          from source_http import fetch
          doc = fetch('https://api.github.com/repos/KrLrtv/Nexus-AI')
          assert json.loads(doc.body)['full_name'] == 'KrLrtv/Nexus-AI'
          print('Live public HTTPS transport: OK; pinned DNS, verified TLS, parsed JSON.')
          print('Retrieved:', doc.retrieved_at, 'SHA256:', doc.digest)
          print('Live Gemini, Android and M5 were NOT tested.')
          PY
      - name: Commit tested metadata and publish new prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="v2.0.7-alpha"
          BRANCH='release/public-sources-v2.0.7'
          test "$GITHUB_REF_NAME" = "$BRANCH"
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release exists; refusing to overwrite.' >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo 'Tag exists; refusing to move it.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add install.sh scripts/termux-install.sh README.md RELEASE_NOTES.md \
            V2_RELEASE_NOTES.md releases/channel.json releases/preview.json SHA256SUMS.txt
          git commit -m 'release: pin tested v2.0.7-alpha Public Source Learning metadata'
          git push origin "HEAD:$BRANCH"
          SHA="$(git rev-parse HEAD)"
          mkdir -p /tmp/nexus-public-release
          git archive --format=zip --prefix="Nexus-AI-$TAG/" \
            -o "/tmp/nexus-public-release/nexus-$TAG-source.zip" HEAD
          cp /tmp/nexus-v2.0.7-tests.txt /tmp/nexus-v2.0.7-https.txt /tmp/nexus-public-release/
          (cd /tmp/nexus-public-release && sha256sum "nexus-$TAG-source.zip" nexus-v2.0.7-tests.txt nexus-v2.0.7-https.txt > SHA256SUMS.txt)
          gh release create "$TAG" /tmp/nexus-public-release/* \
            --target "$SHA" --title 'NEXUS AI v2.0.7-alpha — Public Source Learning' \
            --notes-file RELEASE_NOTES.md --prerelease
          echo "Published $TAG from tested source $SHA; main preview pointer is updated separately."
