name: Publish NEXUS v0.1.6-alpha

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: nexus-v0.1.6-alpha-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'KrLrtv/Nexus-AI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source tree
        run: |
          set -euo pipefail
          test -f nexus-ai/nexusctl.py
          test -f nexus-ai/android_bridge/app.py
          test -f nexus-ai/android_bridge/planner.py
          test -f nexus-firmware/firmware/platformio.ini
          test -f nexus-firmware/firmware/src/main.cpp
          bash -n install.sh scripts/termux-install.sh
          python scripts/check_public_source.py
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in Path('nexus-ai').rglob('*.py'):
              ast.parse(path.read_text(encoding='utf-8-sig'), filename=str(path))
          print('Python source syntax OK')
          PY
      - name: Publish source-only prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="v0.1.6-alpha"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; not overwriting."
            exit 0
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "NEXUS AI v0.1.6-alpha" \
            --notes-file RELEASE_NOTES.md \
            --prerelease
