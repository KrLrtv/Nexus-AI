name: Validate native learning integration
on:
  push:
    branches: [feature/nexus-native-learning]
permissions:
  contents: write
concurrency:
  group: nexus-native-learning-integration
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'KrLrtv/Nexus-AI'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact-source integration
        run: python scripts/integrate_native_learning.py
      - name: Validate sources
        run: |
          set -euo pipefail
          git diff --check
          bash -n install.sh scripts/termux-install.sh
          python scripts/check_release_consistency.py
          python scripts/check_public_source.py
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in Path('nexus-ai').rglob('*.py'):
              ast.parse(path.read_text(encoding='utf-8-sig'), filename=str(path))
          ast.parse(Path('scripts/integrate_native_learning.py').read_text())
          PY
      - name: Run complete offline suite
        run: |
          set -euo pipefail
          python -m unittest discover -s nexus-ai/tests -p 'test_*.py' -v 2>&1 | tee /tmp/nexus-native-tests.txt
      - name: Commit tested integration on feature branch only
        env:
          EXPECTED_BRANCH: feature/nexus-native-learning
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          git fetch origin "$EXPECTED_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nexus-ai/android_bridge/app.py nexus-ai/android_bridge/planner.py
          if ! git diff --cached --quiet; then
            git commit -m 'feat: integrate tested native capability acquisition into text and voice'
            git push origin "HEAD:$EXPECTED_BRANCH"
          fi
          git archive --format=zip -o /tmp/nexus-native-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-native-tested-source
          path: |
            /tmp/nexus-native-source.zip
            /tmp/nexus-native-tests.txt
          retention-days: 7
