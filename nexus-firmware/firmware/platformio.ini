[env:m5stickc_plus2]
platform = espressif32
board = m5stick-c
framework = arduino
board_build.partitions = partitions.csv
board_upload.maximum_size = 3145728
monitor_speed = 115200
lib_deps =
  m5stack/M5StickCPlus2
  bblanchon/ArduinoJson@^7.0.0
  h2zero/NimBLE-Arduino@^1.4.3
build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1

; Optional: build_flags = -DCORE_DEBUG_LEVEL=1 -DNEXUS_ENABLE_BLE
; BLE GATT client is OFF by default until phone pairing is tested.
